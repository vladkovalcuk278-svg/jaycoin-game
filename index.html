<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JayCoin Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #17212b; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; user-select: none; -webkit-user-select: none; }
        h2 { font-size: 24px; margin-bottom: 5px; }
        .score { font-size: 48px; font-weight: 800; margin: 10px 0; color: #ffd700; height: 58px; }
        .income { font-size: 14px; color: #aaa; margin-bottom: 15px; }
        
        /* ВОТ ЗДЕСЬ ДОБАВЛЕНА СТРОКА ПРО СИНИЙ КВАДРАТ */
        .coin-btn { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            border: 6px solid #d4af37; 
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%); 
            font-size: 80px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto; 
            transition: transform 0.05s; 
            outline: none; 
            -webkit-tap-highlight-color: transparent; /* Убирает синий квадрат при тапе */
        }
        
        .coin-btn:active { transform: scale(0.92); }
        .actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #2b5278; color: white; outline: none; -webkit-tap-highlight-color: transparent; }
        .btn:active { opacity: 0.8; }
        #status { margin-top: 20px; font-size: 13px; color: #7f91a4; min-height: 20px; }
        .leaderboard { margin-top: 30px; text-align: left; background: #232e3c; padding: 15px; border-radius: 10px; }
        .leaderboard h3 { margin-top: 0; font-size: 16px; color: #ffd700; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; font-size: 14px; }
    </style>
</head>
<body>
    <h2>JayCoin</h2>
    <div class="score" id="score">0</div>
    <div class="income" id="income">Доход: 0 / час</div>
    
    <button class="coin-btn" id="clickBtn">🪙</button>
    
    <div class="actions">
        <button class="btn" id="upgradeBtn">Улучшить доход (1000)</button>
        <button class="btn" id="bonusBtn">Ежедневный бонус</button>
    </div>

    <div id="status">Загрузка...</div>

    <div class="leaderboard">
        <h3>🏆 Топ игроков</h3>
        <div id="leaderboardList">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const URL = 'https://zyarmtfnzupyzqpklajg.supabase.co/functions/v1/jaycoin-api';
        
        let serverScore = 0;       
        let pendingClicks = 0;     
        let inFlightClicks = 0;    
        let isSyncing = false;
        let lastRenderedScore = -1; 
        let animationFrameId = null;

        const MAX_CPS = 20; 
        let clickTimestamps = []; 

        async function apiCall(payload) {
            try {
                const res = await fetch(URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData, ...payload })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                return data;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        function renderScore() {
            const currentTotal = serverScore + pendingClicks + inFlightClicks;
            if (currentTotal !== lastRenderedScore) {
                document.getElementById('score').innerText = currentTotal;
                lastRenderedScore = currentTotal;
            }
            animationFrameId = requestAnimationFrame(renderScore);
        }

        renderScore();

        async function syncClicks() {
            if (pendingClicks === 0 || isSyncing) return;
            
            isSyncing = true;
            const clicksToSend = pendingClicks;
            pendingClicks = 0; 
            inFlightClicks = clicksToSend; 
            
            const data = await apiCall({ addScore: clicksToSend });
            
            if (data) {
                serverScore = data.balance; 
                inFlightClicks = 0; 
            } else {
                pendingClicks += clicksToSend; 
                inFlightClicks = 0;
            }
            
            isSyncing = false;
        }

        async function loadGame() {
            const data = await apiCall({});
            if (data) {
                serverScore = data.balance;
                pendingClicks = 0;
                inFlightClicks = 0;
                
                document.getElementById('income').innerText = `Доход: ${data.incomePerHour} / час`;
                document.getElementById('status').innerText = "✅ " + data.message;
                document.getElementById('status').style.color = "#4CAF50";
                
                const list = document.getElementById('leaderboardList');
                list.innerHTML = data.leaderboard.map((p, i) => 
                    `<div class="leaderboard-item"><span>${i+1}. ${p.username || 'Игрок'}</span> <span>${p.balance}</span></div>`
                ).join('');
            }
        }

        document.getElementById('clickBtn').addEventListener('click', () => {
            const now = Date.now();
            clickTimestamps = clickTimestamps.filter(time => now - time < 1000);
            
            if (clickTimestamps.length >= MAX_CPS) return; 
            
            clickTimestamps.push(now);
            pendingClicks++; 
            
            if (tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
            }
        });

        setInterval(() => {
            if (pendingClicks > 0) syncClicks();
        }, 1000);

        window.addEventListener('beforeunload', () => {
            if (pendingClicks > 0) {
                const payload = JSON.stringify({ initData: tg.initData, addScore: pendingClicks });
                navigator.sendBeacon(URL, payload); 
            }
        });

        document.getElementById('upgradeBtn').addEventListener('click', async () => {
            const data = await apiCall({ action: 'upgrade_income' });
            if (data) {
                serverScore = data.balance;
                pendingClicks = 0; 
                inFlightClicks = 0;
                document.getElementById('income').innerText = `Доход: ${data.incomePerHour} / час`;
                document.getElementById('status').innerText = "✅ Доход улучшен!";
            }
        });

        document.getElementById('bonusBtn').addEventListener('click', async () => {
            const data = await apiCall({ action: 'daily_bonus' });
            if (data) {
                serverScore = data.balance;
                pendingClicks = 0; 
                inFlightClicks = 0;
                document.getElementById('status').innerText = "✅ Бонус получен! (+500)";
                document.getElementById('status').style.color = "#4CAF50";
            }
        });

        loadGame();
    </script>
</body>
</html>

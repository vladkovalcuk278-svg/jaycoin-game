<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JayCoin Game</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стилизуем игру под темную тему Telegram */
        body {
            background-color: #17212b;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none; /* Запрещаем случайное выделение текста при кликах */
            -webkit-user-select: none;
        }
        h2 {
            font-size: 24px;
            color: #e5e5e5;
            margin-bottom: 10px;
        }
        .score {
            font-size: 56px;
            font-weight: 800;
            margin: 10px 0 30px 0;
            color: #ffd700; /* Золотой цвет */
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .coin-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 6px solid #d4af37;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.05s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        /* Эффект нажатия */
        .coin-btn:active {
            transform: scale(0.92);
        }
        #status {
            margin-top: 40px;
            font-size: 14px;
            color: #7f91a4;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <h2>JayCoin</h2>
    <div class="score" id="score">0</div>
    
    <button class="coin-btn" id="clickBtn">🪙</button>
    
    <div id="status">Подключение к серверу...</div>

    <script>
        // 1. Инициализация Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть игру на весь экран
        tg.ready();  // Сообщить Telegram, что приложение загружено

        // ВАША ССЫЛКА НА ФУНКЦИЮ SUPABASE (уже вставлена)
        const SUPABASE_FUNCTION_URL = 'https://zyarmtfnzupyzqpklajg.supabase.co/functions/v1/jaycoin-api';

        let score = 0;
        const scoreElement = document.getElementById('score');
        const statusElement = document.getElementById('status');
        const clickBtn = document.getElementById('clickBtn');

        // 2. Функция для отправки клика на сервер
        async function sendClickToServer() {
            try {
                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    // Отправляем tg.initData — это уникальный подписанный ключ пользователя от Telegram
                    body: JSON.stringify({ initData: tg.initData }) 
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusElement.innerText = "✅ Сервер: " + data.message;
                    statusElement.style.color = "#4CAF50";
                } else {
                    statusElement.innerText = "❌ Ошибка: " + data.error;
                    statusElement.style.color = "#f44336";
                }
            } catch (error) {
                statusElement.innerText = "⚠️ Ошибка сети! Сервер не отвечает.";
                statusElement.style.color = "#ff9800";
            }
        }

        // 3. Обработка клика по монете
        clickBtn.addEventListener('click', () => {
            score++;
            scoreElement.innerText = score;
            
            // Вибрация при нажатии (если устройство поддерживает)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            
            // Отправляем данные на сервер каждый 10-й клик, чтобы сервер не упал от нагрузки
            if (score % 10 === 0) {
                sendClickToServer();
            }
        });

        // Проверяем связь с сервером сразу при открытии игры
        sendClickToServer();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JayCoin Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #17212b; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; user-select: none; }
        h2 { font-size: 24px; color: #e5e5e5; margin-bottom: 10px; }
        .score { font-size: 56px; font-weight: 800; margin: 10px 0 30px 0; color: #ffd700; }
        .coin-btn { width: 220px; height: 220px; border-radius: 50%; border: 6px solid #d4af37; background: radial-gradient(circle, #ffd700 0%, #b8860b 100%); font-size: 100px; cursor: pointer; transition: transform 0.05s ease; box-shadow: 0 15px 35px rgba(0,0,0,0.4); outline: none; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .coin-btn:active { transform: scale(0.92); }
        #status { margin-top: 40px; font-size: 14px; color: #7f91a4; min-height: 20px; padding: 0 10px; word-wrap: break-word; }
    </style>
</head>
<body>
    <h2>JayCoin</h2>
    <div class="score" id="score">0</div>
    <button class="coin-btn" id="clickBtn">🪙</button>
    <div id="status">Подключение к серверу...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const SUPABASE_FUNCTION_URL = 'https://zyarmtfnzupyzqpklajg.supabase.co/functions/v1/jaycoin-api';
        let score = 0;
        const scoreElement = document.getElementById('score');
        const statusElement = document.getElementById('status');
        const clickBtn = document.getElementById('clickBtn');

        async function sendClickToServer() {
            try {
                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData }) 
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    statusElement.innerText = "✅ " + data.message;
                    statusElement.style.color = "#4CAF50";
                } else {
                    // Показываем реальную ошибку от сервера
                    statusElement.innerText = "❌ Ошибка: " + (data.error || "Сервер отклонил запрос");
                    statusElement.style.color = "#f44336";
                }
            } catch (error) {
                statusElement.innerText = "⚠️ Ошибка сети: " + error.message;
                statusElement.style.color = "#ff9800";
            }
        }

        clickBtn.addEventListener('click', () => {
            score++;
            scoreElement.innerText = score;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            if (score % 10 === 0) sendClickToServer(); // Отправляем каждый 10-й клик
        });

        sendClickToServer(); // Проверка при загрузке
    </script>
</body>
</html>
